name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  recover-named-holder-data:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/named-holder-fetch-links-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/named-holder-fetch-links-20260821
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover, normalize, and commit public name-bearing data
        run: |
          python scripts/recover_named_holder_data.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/named-holder-data
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'research: preserve recovered named holder datasets [skip ci]'
            git push origin HEAD:research/named-holder-fetch-links-20260821
          fi
      - name: Upload source and normalized files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: named-holder-data
          path: research/named-holder-data
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tanho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tanho_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: turso
      TURSO_DATABASE_URL: file:./db/e2e.db
      ADMIN_PASSWORD: e2e-test-password
      ADMIN_SECRET: e2e-test-secret-at-least-32-characters-long
      CRON_SECRET: e2e-test-cron-secret-at-least-32-characters-long
      NEXT_PUBLIC_FEATURE_NEWSLETTER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
