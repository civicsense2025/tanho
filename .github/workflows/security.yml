name: Security

# Compliance-supporting scanning: dependency vulnerabilities, SBOM, secrets, and
# static analysis. Independent of ci.yml (lint/typecheck/test/e2e) — runs on
# push, PR, and a weekly schedule so dependency drift is caught even with no
# code changes.
#
# All steps are read-only static analysis over the checked-out repo; nothing
# executes untrusted code beyond a normal `npm ci`. No new repo secrets are
# needed — the built-in GITHUB_TOKEN is sufficient throughout.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scoped to high+ severity: strict enough to block real risk, without
      # failing the build on low-severity transitive advisories that would
      # otherwise train reviewers to ignore this job.
      - run: npm audit --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CycloneDX SBOM. Complements the signed release pipeline (release.yml /
      # scripts/build-release.ts): a dependency snapshot alongside every
      # Ed25519-signed artifact the hub distributes to customers.
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
