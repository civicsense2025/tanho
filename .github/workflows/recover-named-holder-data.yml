name: Recover named holder data

on:
  push:
    branches:
      - research/named-holder-fetch-links-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: research/named-holder-fetch-links-20260821

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover and normalize public source files
        run: python scripts/recover_named_holder_data.py

      - name: Commit recovered source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/named-holder-data
          if git diff --cached --quiet; then
            echo 'No recovered data changes to commit.'
            exit 0
          fi
          git commit -m 'research: preserve recovered named holder datasets [skip ci]'
          git push origin HEAD:research/named-holder-fetch-links-20260821

      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: named-holder-data
          path: research/named-holder-data
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
